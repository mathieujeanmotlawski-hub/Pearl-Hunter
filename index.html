<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pearl Hunter</title>  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      font-size: 17px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 15px 20px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #results {
      margin-top: 30px;
    }

    .result {
      background: #1d1d1d;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .result a {
      color: #5eb7ff;
      font-size: 20px;
      text-decoration: none;
    }

    .result p {
      color: #ccc;
      line-height: 1.5;
    }

    .url {
      color: #777;
      font-size: 13px;
      word-break: break-all;
    }

    .status {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }
  </style></head><body><div class="container">  <h1>🔎 Pearl Hunter</h1>  <div class="subtitle">
    Recherche Web multi-sources
  </div>  <div class="search">
    <input
      id="query"
      type="text"
      placeholder="Que cherches-tu ?"
      onkeydown="if(event.key === 'Enter') searchWeb()"
    ><button onclick="searchWeb()">
  Rechercher
</button>

  </div>  <div id="status" class="status"></div>  <div id="results"></div></div><script>

async function searchWeb() {

  const query = document.getElementById("query").value.trim();
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if (!query) {
    status.textContent = "Écris quelque chose à rechercher.";
    return;
  }

  results.innerHTML = "";
  status.textContent = "🔎 Recherche sur le Web...";

  const api =
    "https://search.bus-hit.me/search?q=" +
    encodeURIComponent(query) +
    "&format=json&language=fr";

  try {

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("Erreur du moteur de recherche");
    }

    const data = await response.json();

    status.textContent =
      data.results && data.results.length
        ? data.results.length + " résultats trouvés"
        : "Aucun résultat trouvé.";

    if (!data.results || data.results.length === 0) {
      results.innerHTML =
        "<p>Aucun résultat. Essaie une autre recherche.</p>";
      return;
    }

    data.results.forEach(result => {

      const div = document.createElement("div");
      div.className = "result";

      const title = document.createElement("a");
      title.href = result.url;
      title.target = "_blank";
      title.rel = "noopener noreferrer";
      title.textContent = result.title || "Résultat";

      const description = document.createElement("p");
      description.textContent =
        result.content || "Aucune description disponible.";

      const url = document.createElement("div");
      url.className = "url";
      url.textContent = result.url || "";

      div.appendChild(title);
      div.appendChild(description);
      div.appendChild(url);

      results.appendChild(div);
    });

  } catch (error) {

    console.error(error);

    status.textContent =
      "⚠️ Le moteur n'a pas répondu.";

    results.innerHTML =
      "<p>Le moteur de recherche est momentanément indisponible. Nous pourrons en brancher un autre.</p>";
  }
}

</script></body>
</html>
