<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pearl Hunter</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #111a33;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #aeb9d8;
      margin-top: 8px;
    }

    main {
      padding: 25px 15px;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #151f3d;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 25px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #ffffff;
      color: #111a33;
    }

    .secondary {
      background: #26345f;
      color: white;
    }

    #result {
      margin-top: 20px;
      min-height: 30px;
      color: #dbe4ff;
    }
  </style>
</head>

<body>

  <header>
    <h1>💎 Pearl Hunter</h1>
    <div class="subtitle">Ton chasseur personnel d'opportunités</div>
  </header>

  <main>

    <div class="card">
      <h2>🔎 Recherche d'opportunités</h2>

      <p>
        Trouve et analyse des opportunités intéressantes.
      </p>

      <button class="primary" onclick="lancerRecherche()">
        🚀 Lancer la recherche
      </button>

      <button class="secondary" onclick="afficherMessage()">
        📊 Mon tableau de bord
      </button>

      <div id="result">
        Prêt à chasser...
      </div>
    </div>

  </main>

  <script>
    function lancerRecherche() {
      document.getElementById("result").innerHTML =
        "🔍 Recherche en cours...<br><br>Le moteur Pearl Hunter va bientôt analyser les opportunités.";
    }

    function afficherMessage() {
      document.getElementById("result").innerHTML =
        "📊 Tableau de bord : bientôt disponible.";
    }
  </script>

</body>
</html>
